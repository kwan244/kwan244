  <text x="40" y="96" class="mono" font-size="17" fill="#9FB8AD"><tspan fill="#6EE7B7">kevin@auckland</tspan> ~ %</text>
  <text x="230" y="96" clip-path="url(#typing)" class="mono" font-size="17" fill="#9FB8AD">whoami</text>
  <text x="40" y="170" class="mono" font-size="58" font-weight="700" letter-spacing="-2" fill="#A7F3D0">Kevin Wang</text>
