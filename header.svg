<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Kevin Wang — Software Engineering</title>
  <desc id="description">A mint-on-ink terminal introducing Kevin Wang, a fourth-year Software Engineering student at the University of Auckland, based in Auckland, New Zealand.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
    .reveal { animation: type .75s steps(6, end) .35s both; }
    .cursor { animation: blink 1s step-end 3; }
    @keyframes type { from { width: 0; } to { width: 90px; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .reveal, .cursor { animation: none; } }
  </style>
  <defs>
    <linearGradient id="glow" x1="40" y1="278" x2="660" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14382B" stop-opacity=".65"/>
      <stop offset="1" stop-color="#0A0D0C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typing"><rect class="reveal" x="230" y="72" width="90" height="32"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="959" height="289" rx="18" fill="#0A0D0C" stroke="#24302B"/>
  <rect x="1" y="47" width="958" height="242" rx="17" fill="url(#glow)"/>
  <path d="M1 47H959" stroke="#24302B"/>
  <circle cx="25" cy="24" r="4" fill="#4A5F56"/>
  <circle cx="42" cy="24" r="4" fill="#4A5F56"/>
  <circle cx="59" cy="24" r="4" fill="#6EE7B7"/>
